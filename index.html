<style>
:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --surface-2:#f6f6f6;
  --surface-3:#ededed;
  --ink:#1a1a1a;
  --ink-soft:#6b6b6b;
  --ink-faint:#9a9a9a;
  --line:#ebebeb;
  --line-soft:#f3f3f3;
  --black:#161616;
  --black-2:#2c2c2c;
  --shadow:0 1px 3px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
  --radius:14px;--radius-sm:10px;--radius-lg:20px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:0;height:0;}
input,textarea,select,button{font-family:inherit;font-size:14px;color:var(--ink);}
input,textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;width:100%;outline:none;transition:border-color .15s;font-size:14px;}
input:focus,textarea:focus,select:focus{border-color:var(--black);}
textarea{resize:vertical;min-height:56px;line-height:1.55;}
button{cursor:pointer;border:none;background:none;}
img{display:block;}

/* ===== 主区域 ===== */
.app{display:flex;flex-direction:column;min-height:100vh;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;padding-bottom:64px;}

/* ===== 顶部标题栏（每个模块不同） ===== */
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.tb-title{font-size:18px;font-weight:500;letter-spacing:.5px;display:flex;align-items:baseline;gap:6px;}
.tb-sub{font-size:12px;color:var(--ink-faint);font-weight:400;}
.tb-actions{display:flex;gap:8px;align-items:center;}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:24px;font-size:13px;color:var(--ink-soft);transition:all .15s;white-space:nowrap;}
.btn:hover{border-color:var(--black);color:var(--ink);}
.btn.primary{background:var(--black);color:#fff;border-color:var(--black);}
.btn.primary:hover{opacity:.85;}
.btn.dark{background:var(--black);color:#fff;border-color:var(--black);}
.btn.sm{padding:6px 12px;font-size:12px;}
.btn.round{width:34px;height:34px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;}

.module{padding:18px 18px 40px;max-width:960px;width:100%;margin:0 auto;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}

/* ===== Hero ===== */

}
.hero-tag{font-size:11px;opacity:.55;display:flex;align-items:center;gap:6px;margin-bottom:14px;text-transform:uppercase;letter-spacing:3px;}
.hero-tag span{width:4px;height:4px;border-radius:50%;background:#c8b89a;}
.hero h1{font-size:30px;font-weight:300;letter-spacing:2px;line-height:1.35;font-family:var(--font);}
.hero h1 em{font-style:normal;color:#d4c5b0;font-weight:400;}
.hero p{font-size:13px;opacity:.6;margin-top:10px;letter-spacing:.5px;}
.hero-en{font-family:'Georgia','Times New Roman',serif;font-style:italic;font-size:15px;opacity:.45;letter-spacing:2px;margin-top:12px;display:block;}

/* ===== 选择器 ===== */
.selector-group{margin-bottom:16px;}
.selector-label{font-size:13px;color:var(--ink-soft);margin-bottom:9px;font-weight:400;}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;}
.tag-pill{padding:8px 15px;border-radius:24px;font-size:13px;font-weight:400;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);transition:all .14s;user-select:none;display:inline-flex;align-items:center;gap:5px;}
.tag-pill:hover{border-color:#bbb;}
.tag-pill.active{background:var(--black);color:#fff;border-color:var(--black);}
.temp-row{display:flex;flex-wrap:wrap;gap:8px;}
.temp-btn{width:50px;height:42px;border-radius:12px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);transition:all .14s;user-select:none;}
.temp-btn:hover{border-color:#bbb;}
.temp-btn.active{background:var(--black);color:#fff;border-color:var(--black);}
.weather-row{display:flex;flex-wrap:wrap;gap:8px;}
.w-btn{padding:8px 18px;border-radius:24px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);transition:all .14s;user-select:none;display:inline-flex;align-items:center;gap:5px;}
.w-btn:hover{border-color:#bbb;}
.w-btn.active{background:var(--black);color:#fff;border-color:var(--black);}

/* ===== 大按钮 ===== */
.big-btn{width:100%;padding:15px;border-radius:var(--radius-lg);font-size:16px;font-weight:500;text-align:center;cursor:pointer;transition:all .18s;letter-spacing:1px;}
.big-btn.primary{background:var(--black);color:#fff;border:1px solid var(--black);}
.big-btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.18);}
.big-btn.outline{background:#fff;color:var(--ink);border:1px solid var(--line);}
.big-btn.outline:hover{border-color:var(--black);}

/* ===== 底部导航 ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 18px;}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 14px;border-radius:10px;color:var(--ink-faint);transition:color .15s;}
.bnav-item svg{width:23px;height:23px;}
.bnav-item span{font-size:10px;font-weight:400;}
.bnav-item.active{color:var(--black);}

/* ===== 衣橱 ===== */
.tab-seg{display:inline-flex;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--surface);}
.tab-seg button{padding:8px 22px;font-size:13px;color:var(--ink-soft);background:transparent;border:none;cursor:pointer;transition:all .15s;}
.tab-seg button:hover{background:var(--surface-2);}
.tab-seg button.active{background:var(--black);color:#fff;}
.filter-row{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;}
.fpill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:400;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);transition:all .12s;user-select:none;}
.fpill:hover{border-color:#bbb;}
.fpill.active{background:var(--black);color:#fff;border-color:var(--black);}
.closet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:8px;}
.item-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;transition:box-shadow .18s;}
.item-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);}
.item-img{height:200px;position:relative;background:var(--surface-2);overflow:hidden;}
.item-img img{width:100%;height:100%;object-fit:cover;}
.item-img .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);}
.item-img .item-actions{position:absolute;top:8px;right:8px;display:flex;gap:5px;opacity:0;transition:opacity .15s;}
.item-card:hover .item-actions{opacity:1;}
.item-action{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;}
.item-action:hover{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);}
.preview-bar{position:fixed;left:0;right:0;bottom:60px;z-index:90;background:rgba(10,9,8,.96);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;padding-bottom:calc(11px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.22);}
.preview-bar .cnt{font-size:13px;font-weight:500;}
.item-info{padding:11px 12px;}
.item-name{font-size:14px;font-weight:500;margin-bottom:3px;}
.item-cat{font-size:11px;color:var(--ink-faint);margin-bottom:6px;}
.item-tags{display:flex;flex-wrap:wrap;gap:4px;}
.itag{font-size:10px;padding:3px 8px;border-radius:12px;background:var(--surface-2);color:var(--ink-soft);}

/* ===== 搭配库 ===== */
.outfit-card{border:1px solid var(--line);border-radius:var(--radius);padding:15px;background:#fff;margin-bottom:13px;}
.outfit-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px;}
.outfit-scene{font-size:12px;padding:3px 11px;border-radius:14px;background:var(--surface-2);color:var(--ink-soft);font-weight:400;}
.outfit-meta{font-size:12px;color:var(--ink-faint);}
.outfit-name{font-size:15px;font-weight:500;margin-bottom:8px;}
.outfit-items{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.outfit-item-thumb{width:52px;height:66px;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line-soft);}
.outfit-item-thumb img{width:100%;height:100%;object-fit:cover;}
.outfit-note{font-size:13px;color:var(--ink-soft);font-style:italic;}

/* ===== 统计 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
.stat-card{border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;background:#fff;}
.stat-num{font-size:30px;font-weight:500;letter-spacing:-.5px;}
.stat-lab{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.rank-list{border-top:1px solid var(--line);padding-top:14px;}
.rank-list h3{font-size:14px;font-weight:500;margin-bottom:10px;}
.rank-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);}
.rank-item:last-child{border-bottom:none;}
.rank-no{font-size:14px;font-weight:400;color:var(--ink-faint);width:24px;flex-shrink:0;}
.rank-thumb{width:42px;height:42px;border-radius:8px;overflow:hidden;background:var(--surface-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-faint);}
.rank-thumb img{width:100%;height:100%;object-fit:cover;}
.rank-info{flex:1;min-width:0;}
.rank-name{font-size:14px;font-weight:500;}
.rank-sub{font-size:12px;color:var(--ink-faint);}
.rank-count{font-size:14px;font-weight:500;flex-shrink:0;}

.empty-state{text-align:center;padding:40px 20px;color:var(--ink-faint);}
.empty-state .emoji{font-size:46px;margin-bottom:10px;}
.hint{font-size:12px;color:var(--ink-faint);background:var(--surface-2);border-radius:8px;padding:9px 12px;margin-top:10px;line-height:1.6;}

/* ===== 弹窗 ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:translateY(16px);transition:transform .2s;}
.modal-overlay.show .modal{transform:translateY(0);}
.modal h3{font-size:18px;font-weight:500;margin-bottom:16px;}
.modal .field{margin-bottom:12px;}
.modal .field label{display:block;font-size:12px;color:var(--ink-soft);font-weight:400;margin-bottom:4px;}
.modal .acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.img-upload{border:1.5px dashed #ccc;border-radius:var(--radius-sm);padding:24px 18px;text-align:center;color:var(--ink-faint);font-size:14px;cursor:pointer;transition:all .15s;display:block;}
.img-upload:hover,.img-upload:active{border-color:#999;color:var(--ink-soft);background:#fafafa;}
.img-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.img-preview img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
.chk-group{display:flex;gap:6px;flex-wrap:wrap;}
.chk-group label{font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px 0;}
.item-pick{border:1px solid var(--line);border-radius:8px;padding:8px;max-height:220px;overflow-y:auto;}

const IDB_NAME = 'wd_wardrobe_idb';

/* ===== 存储（双引擎：localStorage + IndexedDB 跨上下文共享）===== */
function _idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbSave(data){
  try{ const db=await _idb(); const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(data,STORE_KEY); tx.oncomplete=()=>db.close(); }catch(e){}
}
async function idbLoad(){
  try{
    const db=await _idb();
    const tx=db.transaction(IDB_STORE,'readonly');
    return await new Promise((res,rej)=>{
      const req=tx.objectStore(IDB_STORE).get(STORE_KEY);
      req.onsuccess=()=>{ db.close(); res(req.result); };
      req.onerror=()=>{ db.close(); rej(req.error); };
    });
  }catch(e){ return null; }
}

function _migrate(s){
  const base=defaultState();
  ['match','wardrobeTab','filters','profile','preview','aiKey'].forEach(k=>{ if(s[k]===undefined) s[k]=base[k]; });
  return s;
}

function save(){
  const data=JSON.stringify(state);
  // localStorage 有配额限制(iOS Safari ~5MB),超容时静默降级到只存 IndexedDB
  try{ localStorage.setItem(STORE_KEY,data); }
  catch(e){
    console.warn('localStorage 超容,降级到 IndexedDB:',e.name);
    try{ localStorage.removeItem(STORE_KEY); }catch(_){}
  }
  idbSave(data); // IndexedDB 容量大(~50MB+),跨上下文共享,图片存这里最稳
}

/* 图片压缩:上传的高清照片压缩到最大 800px 宽、JPEG 0.8 质量,大幅减少存储占用,防止 localStorage 超容丢图 */
function compressImage(dataUrl, maxW, quality){
  return new Promise((res)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      try{ res(cv.toDataURL('image/jpeg',quality)); }
      catch(e){ res(dataUrl); } // 压缩失败用原图
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}

function computeStats(){
  const total=state.clothes.length;
  const thisMonth=state.outfits.filter(o=>o.date&&o.date.startsWith(todayStr().slice(0,7))).length;
  const outfitTotal=state.outfits.length;
  const thirtyDaysAgo=new Date();thirtyDaysAgo.setDate(thirtyDaysAgo.getDate()-30);
  const dstr=thirtyDaysAgo.toISOString().slice(0,10);
  const wornList=state.clothes.filter(c=>c.lastWorn&&c.lastWorn>=dstr);
  const unworn=total-wornList.length;
  const ranked=[...state.clothes].sort((a,b)=>(b.wearCount||0)-(a.wearCount||0));
  const totalValue=state.clothes.reduce((s,c)=>s+(Number(c.price)||0),0);
  const avgWear=total?Math.round(state.clothes.reduce((s,c)=>s+(c.wearCount||0),0)/total*10)/10:0;
  const idleRate=total?Math.round(unworn/total*100):0;
  // 一衣多搭：每件单品出现在几个搭配里
  const appear={};
  state.outfits.forEach(o=>(o.items||[]).forEach(id=>appear[id]=(appear[id]||0)+1));
  const multiWear=[...state.clothes].map(c=>({c,n:appear[c.id]||0})).sort((a,b)=>b.n-a.n);
  const notInOutfit=state.clothes.filter(c=>!appear[c.id]).length;
  // 风格占比
  const styleCount={};
  state.clothes.forEach(c=>(c.style||[]).forEach(s=>styleCount[s]=(styleCount[s]||0)+1));
  const styleDist=Object.entries(styleCount).sort((a,b)=>b[1]-a[1]);
  // 色彩占比：先判饱和度/明度（中性色按黑白灰），高饱和才按色相分色系
  const toneOf=hex=>{
    let h=hex.replace('#',''); if(h.length===3) h=h.split('').map(x=>x+x).join('');
    const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,lum=(mx+mn)/2,sat=mx===0?0:d/(mx+mn);
    if(lum<80&&sat<0.20) return '黑';
    if(lum>200) return '白';
    if(sat<0.06) return '灰';
    let hh;if(mx===r)hh=((g-b)/d)%6;else if(mx===g)hh=(b-r)/d+2;else hh=(r-g)/d+4;
    hh=Math.round(hh*60);if(hh<0)hh+=360;
    if(hh<15||hh>=345)return '红';if(hh<45)return '橙';if(hh<70)return '黄';
    if(hh<160)return '绿';if(hh<200)return '青';if(hh<260)return '蓝';if(hh<320)return '紫';return '粉';
  };
  const toneCount={};
  state.clothes.forEach(c=>{const t=toneOf(c.color||'#cccccc');toneCount[t]=(toneCount[t]||0)+1;});
  const colorDist=Object.entries(toneCount).sort((a,b)=>b[1]-a[1]);
  // 衣橱健康度评分：穿着活跃度 + 搭配覆盖度
  const wearScore=total?Math.round((1-unworn/total)*100):0;
  const coverScore=total?Math.round((1-notInOutfit/total)*100):0;
  const healthScore=Math.round(wearScore*0.6+coverScore*0.4);
  return{total,thisMonth,outfitTotal,unworn,ranked,totalValue,avgWear,idleRate,multiWear,notInOutfit,styleDist,colorDist,healthScore};
}

function distBar(dist, colorOf){
  if(!dist||!dist.length) return `<div style="font-size:12px;color:var(--ink-faint);">暂无数据</div>`;
  const sum=dist.reduce((s,d)=>s+d[1],0);
  const max=Math.max(...dist.map(d=>d[1]));
  return dist.map(([k,v])=>{
    const pct=max?Math.round(v/max*100):0;
    const ratio=Math.round(v/sum*100);
    const col=(colorOf&&colorOf(k))||'#1a1a1a';
    return `<div style="margin-bottom:9px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span>${esc(k)}</span><span style="color:var(--ink-faint);">${v}件 · ${ratio}%</span></div>
      <div style="height:7px;background:var(--surface-2);border-radius:6px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${col};border-radius:6px;"></div></div>
    </div>`;
  }).join('');
}

function handleAction(act,el){
  switch(act){
    case 'nav': state.nav=el.dataset.mod; save(); render(); window.scrollTo(0,0); break;
    case 'setScene': state.match.scene=el.dataset.v; save(); renderModule(); break;
    case 'setTemp': state.match.temp=+el.dataset.v; save(); renderModule(); break;
    case 'setWeather': state.match.weather=el.dataset.v; save(); renderModule(); break;
    case 'generateOutfit': generateOutfit(); break;
    case 'aiConsult': showModal('aiConsult'); break;
    case 'editProfile': showModal('profile'); break;
    case 'setWardrobeTab': state.wardrobeTab=el.dataset.v; state.filters={category:({clothes:'衣服',shoes:'鞋',acc:'配饰'})[el.dataset.v],type:'全部',season:'全部',style:'全部'}; save(); renderModule(); break;
    case 'setTypeFilter': state.filters.type=el.dataset.v; save(); renderModule(); break;
    case 'setSeasonFilter': state.filters.season=el.dataset.v; save(); renderModule(); break;
    case 'setStyleFilter': state.filters.style=el.dataset.v; save(); renderModule(); break;
    case 'addItem': showModal('addItem'); break;
    case 'quickPhoto': { const inp=document.getElementById('quickPhotoInput'); if(inp) inp.click(); break; }
    case 'toggleSort': sortMode=!sortMode; renderModule(); break;
    case 'exportData': exportBackup(); break;
    case 'restoreData': { const inp=document.getElementById('restoreInput'); if(inp) inp.click(); break; }
    case 'cancelModal': closeModal(); break;
    case 'quickCatPick': {
      const k=el.dataset.cat;
      const photos=_pendingPhotos; _pendingPhotos=null;
      closeModal();
      if(photos&&photos.length) handleQuickPhotos(photos,k);
      break;
    }
    case 'aiClassify': {
      const keyInput=$('#aiKeyInput');
      const key=(keyInput?keyInput.value.trim():'')||state.aiKey||'';
      if(!key){ toast('请输入 Gemini API Key'); break; }
      state.aiKey=key; save();
      const photos=_pendingPhotos; _pendingPhotos=null;
      closeModal();
      if(photos&&photos.length) aiClassifyPhotos(photos,key);
      else toast('没有待识别的照片');
      break;
    }
    case 'editItem': showModal('addItem', el.dataset.id); break;
    case 'deleteItem': showConfirm('确定删除这件单品？','item',el.dataset.id); break;
    case 'freeMatch': showModal('freeMatch'); break;
    case 'addOutfit': showModal('addOutfit'); break;
    case 'editOutfit': showModal('addOutfit', el.dataset.id); break;
    case 'deleteOutfit': showConfirm('确定删除这套搭配？','outfit',el.dataset.id); break;
    case 'switchWardrobe': toast('当前只有一个衣橱'); break;
    case 'cancelDel': pendingDel=null; closeModal(); break;
    case 'confirmDel': {
      if(pendingDel){
        if(pendingDel.type==='item') state.clothes=state.clothes.filter(c=>c.id!==pendingDel.id);
        else state.outfits=state.outfits.filter(o=>o.id!==pendingDel.id);
      }
      pendingDel=null; save(); closeModal(); renderModule(); break;
    }
    case 'pickPreview': {
      state.preview=state.preview||[];
      const id=el.dataset.id;
      if(!state.preview.includes(id)) state.preview.push(id);
      save(); renderModule(); break;
    }
    case 'clearPreview': state.preview=[]; save(); renderModule(); break;
    case 'openPreview': if((state.preview||[]).length) showModal('preview'); else toast('先选几件单品再加入搭配'); break;
    case 'cancelPreview': closeModal(); break;
    case 'prevCombo': pvGo(-1); break;
    case 'nextCombo': pvGo(1); break;
    case 'pickThumb': {
      if(!_pv) break;
      const key=el.dataset.cat;
      const found=_pv.combos.findIndex(c=>c[key]&&c[key].id===el.dataset.id);
      if(found>=0){ _pvIdx=found; refreshPreviewUI(); }
      break;
    }
    case 'savePreviewOutfit': {
      if(!_pv){ toast('先选几件单品'); break; }
      const c=_pv.combos[_pvIdx]||{};
      const ids=[c.top,c.bottom,c.shoe,c.acc].filter(Boolean).map(x=>x.id);
      if(!ids.length){ toast('先选几件单品'); break; }
      const outfit={id:uid(),name:'我的搭配',scene:state.match.scene,temp:[state.match.temp-1,state.match.temp+1],weather:[state.match.weather],items:ids,date:todayStr(),note:''};
      state.outfits.unshift(outfit);
      state.preview=[]; _pv=null;
      save(); closeModal(); renderModule();
      toast('已保存为搭配 ✓'); break;
    }
    case 'savePreviewAll': {
      const ids=(state.preview||[]).slice();
      if(!ids.length){ toast('先选几件单品'); break; }
      const outfit={id:uid(),name:'我的搭配',scene:state.match.scene,temp:[state.match.temp-1,state.match.temp+1],weather:[state.match.weather],items:ids,date:todayStr(),note:''};
      state.outfits.unshift(outfit);
      state.preview=[]; _pv=null;
      save(); closeModal(); renderModule();
      toast('已保存 '+ids.length+' 件为搭配 ✓'); break;
    }
  }
}

/* ========== 生成搭配 ========== */
function generateOutfit(){
  const m=state.match;
  let tops=state.clothes.filter(c=>c.category==='衣服'&&['上装','连衣裙'].includes(c.type));
  let bottoms=state.clothes.filter(c=>c.category==='衣服'&&c.type==='下装');
  let shoes=state.clothes.filter(c=>c.category==='鞋');
  let accs=state.clothes.filter(c=>c.category==='配饰');
  if(m.temp>=28){tops=tops.filter(c=>c.season.includes('夏'));bottoms=bottoms.filter(c=>c.season.includes('夏'));}
  else if(m.temp<=24){tops=tops.filter(c=>c.season.includes('春')||c.season.includes('秋'));}
  const pick=(arr,n)=>arr.sort(()=>Math.random()-.5).slice(0,Math.min(n,arr.length));
  const chosen=[...pick(tops,1),...pick(bottoms,1),...pick(shoes,1),...pick(accs,1)];
  if(chosen.length<2){toast('衣橱单品不够，请先添加更多');return;}
  const outfit={id:uid(),name:`${m.scene}${m.temp>=28?'清凉':'舒适'}Look`,scene:m.scene,temp:[m.temp-1,m.temp+1],weather:[m.weather],items:chosen.map(i=>i.id),date:todayStr(),note:`${m.scene} · ${m.temp}° · ${m.weather}`};
  state.outfits.unshift(outfit);
  chosen.forEach(item=>{item.wearCount=(item.wearCount||0)+1;item.lastWorn=todayStr();});
  save();
  $('#todayRecommend').innerHTML=`
    <div class="card" style="border-color:var(--black);">
      <div style="font-weight:500;color:var(--black);margin-bottom:10px;">✨ 为你生成的搭配方案</div>
      <div style="font-size:16px;font-weight:500;margin-bottom:8px;">${esc(outfit.name)}</div>
      <div class="outfit-items">${chosen.map(c=>`<div class="outfit-item-thumb">${imgTag(c)}</div>`).join('')}</div>
      <div style="font-size:13px;color:var(--ink-soft);margin-top:6px;">${chosen.map(c=>c.name).join(' + ')}</div>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button class="btn sm primary" data-act="useOutfit">采用这套</button>
        <button class="btn sm" data-act="regenerate">换一套</button>
      </div>
    </div>`;
  $('#todayRecommend').scrollIntoView({behavior:'smooth',block:'start'});
  toast('已生成搭配方案！');
}

function buildPreviewCombos(){
  const items=(state.preview||[]).map(getClothById).filter(Boolean);
  const tops=items.filter(c=>['上装','连衣裙'].includes(c.type));
  const bots=items.filter(c=>c.type==='下装');
  const shoes=items.filter(c=>c.category==='鞋');
  const accs=items.filter(c=>c.category==='配饰');
  const groups={tops,bots,shoes,accs};
  const opts=[tops.length?tops:[null],bots.length?bots:[null],shoes.length?shoes:[null],accs.length?accs:[null]];
  const combos=[];const idx=[0,0,0,0];
  (function rec(ci){ if(ci===4){ combos.push({top:opts[0][idx[0]],bottom:opts[1][idx[1]],shoe:opts[2][idx[2]],acc:opts[3][idx[3]]}); return; } for(let k=0;k<opts[ci].length;k++){idx[ci]=k;rec(ci+1);} })(0);
  return {combos,groups};
}
function pvInner(){
  if(!_pv) return '';
  const c=_pv.combos[_pvIdx]; const total=_pv.combos.length;
  // 平铺拼图:所有单品散落在一张卡片里

  };
  const fig=`<div class="flatlay-wrap" id="figwrap">
    ${flItem('fl-t1',c.top)}
    ${flItem('fl-b1',c.bottom)}
    ${flItem('fl-s1',c.shoe)}
    ${flItem('fl-a1',c.acc)}
    ${flItem('fl-a2',_pv.groups.accs[1]!==c.acc?_pv.groups.accs[1]:null)}
  </div>`;
  const bar = total>1 ? `<div class="combobar"><button class="cb-arrow" data-act="prevCombo">‹</button><div class="cb-mid"><div class="cb-num">搭配 ${_pvIdx+1} / ${total}</div><div class="cb-hint">← 左右滑动换搭 →</div></div><button class="cb-arrow" data-act="nextCombo">›</button></div>` : `<div class="combobar solo">已是一套搭配</div>`;
  const thr=(lab,key,arr)=>{ if(!arr||!arr.length) return ''; const active=c[key]; return `<div class="thr"><span class="thr-lab">${lab}</span><div class="thr-items">${arr.map(it=>`<div class="thr-item ${active&&active.id===it.id?'on':''}" data-act="pickThumb" data-cat="${key}" data-id="${it.id}">${it.img?`<img src="${esc(it.img)}" alt="">`:''}</div>`).join('')}</div></div>`; };

const _CATMAP={top:{category:'衣服',type:'上装'},bottom:{category:'衣服',type:'下装'},outer:{category:'衣服',type:'外套'},dress:{category:'衣服',type:'连衣裙'},shoes:{category:'鞋',type:'休闲鞋'},bag:{category:'配饰',type:'包袋'},acc:{category:'配饰',type:'配饰'}};

/* AI 分类映射：Gemini 返回的关键词 → 内部类别 */
const _AI_MAP={
  '上装|上衣|T恤|衬衫|卫衣|毛衣|针织|背心|吊带|短袖|长袖|blouse|shirt|top|sweater|hoodie|tank':'top',
  '下装|裤子|牛仔裤|短裤|裙裤|阔腿裤|直筒裤|西裤|休闲裤|pants|jeans|trousers|shorts':'bottom',
  '外套|大衣|风衣|夹克|西装|羽绒服|棉服|开衫|coat|jacket|blazer|cardigan|outerwear':'outer',
  '连衣裙|裙子|长裙|短裙|半身裙|吊带裙|dress|skirt':'dress',
  '鞋|运动鞋|小白鞋|靴子|高跟鞋|平底鞋|乐福鞋|凉鞋|帆布鞋|shoes|sneakers|boots|heels':'shoes',
  '包|手提包|斜挎包|背包|双肩包|链条包|托特包|bag|handbag|purse|backpack|tote':'bag',
  '帽子|墨镜|眼镜|项链|耳环|手链|戒指|手表|丝巾|腰带|发饰|cap|hat|sunglasses|glasses|necklace|earring|bracelet|watch|scarf|belt':'acc'
};
function handleQuickPhotos(files, catKey){

/* ========== AI 智能识别分类 (Google Gemini Vision) ========== */
function aiClassifyPhotos(files,apiKey){
  const arr=Array.from(files||[]).filter(f=>f&&f.type&&f.type.indexOf('image/')===0);
  if(!arr.length){ toast('没有有效图片'); return; }
  toast('AI 正在识别 '+arr.length+' 张照片...');
  let done=0, added=0;
  const prompt=`你是一个服装分类专家。请判断这张图片中的单品属于以下哪一类，只返回一个类别关键词：
上装、下装外套、连衣裙、鞋、包包、配饰。
规则：
- T恤/衬衫/卫衣/毛衣/背心 → 上装
- 裤子/短裤/牛仔裤 → 下装
- 大衣/风衣/夹克/西装/羽绒服/开衫 → 外套
- 连衣裙/裙子 → 连衣裙
- 运动鞋/靴子/高跟鞋/凉鞋 → 鞋
- 手提包/双肩包/链条包 → 包包
- 墨镜/帽子/项链/耳环/手表/腰带/丝巾 → 配饰

只回复一个词，不要解释。`;
  arr.forEach((f,i)=>{
    const reader=new FileReader();
    reader.onload=async ()=>{
      try{
        const b64=reader.result.split(',')[1];
        const resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+apiKey,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            contents:[{parts:[
              {text:prompt},
              {inline_data:{mime_type:f.type,data:b64}}
            ]}],
            generationConfig:{temperature:0.1,maxOutputTokens:10}
          })
        });
        const data=await resp.json();
        let raw=(data.candidates?.[0]?.content?.parts?.[0]?.text||'').trim();
        // 匹配类别
        let catKey='top';
        for(const [k,v] of Object.entries(_AI_MAP)){
          const keys=v.split('|');
          if(keys.some(k2=>raw.toLowerCase().includes(k2.toLowerCase()))){catKey=k;break;}
        }
        const cat=_CATMAP[catKey]||_CATMAP.top;
        const compressed=await compressImage(reader.result,800,0.8);
        state.clothes.push({id:uid(),name:_CATLABEL[catKey]+' '+(added+1),category:cat.category,type:cat.type,season:['春','夏','秋','冬'],style:['简约'],color:'#dddddd',img:compressed,price:null,brand:'',wearCount:0,lastWorn:'',tags:[],aiRaw:raw});
        added++;
      }catch(e){
        console.warn('AI classify error:',e);
        const compressed=await compressImage(reader.result,800,0.8);
        state.clothes.push({id:uid(),name:'我的单品 '+(added+1),category:'衣服',type:'上装',season:['春','夏','秋','冬'],style:['简约'],color:'#dddddd',img:compressed,price:null,brand:'',wearCount:0,lastWorn:'',tags:[]});
        added++;
      }
      if(++done===arr.length){
        save(); renderModule();
        toast('AI 识别完成!已添加 '+added+' 件 ✓');
      }
    };
    reader.readAsDataURL(f);
  });
}

/* ========== 拖拽排序（触摸 Pointer 事件） ========== */
function attachSortHandlers(){
  const grid=document.querySelector('.closet-grid'); if(!grid) return;
  grid.querySelectorAll('.item-card').forEach(card=>card.addEventListener('pointerdown', onDragStart));
}
function onDragStart(e){
  if(!sortMode) return;
  const card=e.currentTarget, grid=card.parentElement;
  const startX=e.clientX, startY=e.clientY; let started=false, lastY=startY;
  function move(ev){
    const dx=ev.clientX-startX, dy=ev.clientY-startY;
    if(!started){ if(Math.hypot(dx,dy)<6) return; started=true; card.classList.add('dragging'); try{card.setPointerCapture(e.pointerId);}catch(_){} }
    card.style.transform=`translate(${dx}px,${dy}px)`; lastY=ev.clientY;
  }
  function up(){
    card.removeEventListener('pointermove',move); card.removeEventListener('pointerup',up); card.removeEventListener('pointercancel',up);
    if(!started) return;
    card.classList.remove('dragging'); card.style.transform='';
    const ids=[...grid.querySelectorAll('.item-card')].map(c=>c.dataset.id);
    const from=ids.indexOf(card.dataset.id); ids.splice(from,1);
    const others=[...grid.querySelectorAll('.item-card')].filter(c=>c!==card);
    let ref=null;
    for(const o of others){ const r=o.getBoundingClientRect(); if(lastY < r.top + r.height/2){ ref=o; break; } }
    const insertAt = ref? ids.indexOf(ref.dataset.id) : ids.length;
    ids.splice(insertAt,0,card.dataset.id);
    reorderClothes(ids); save(); renderModule();
  }
  card.addEventListener('pointermove',move); card.addEventListener('pointerup',up); card.addEventListener('pointercancel',up);
}
function reorderClothes(ids){
  const catMap={clothes:'衣服',shoes:'鞋',acc:'配饰'}; const cat=catMap[state.wardrobeTab];
  const inTab=c=>c.category===cat;
  const reordered=ids.map(id=>state.clothes.find(c=>c.id===id)).filter(Boolean);
  let i=0; state.clothes=state.clothes.map(c=> inTab(c)? reordered[i++] : c);
}

function restoreBackup(file){
  if(!file){ toast('请选择备份文件'); return; }
  const r=new FileReader();
  r.onload=()=>{
    try{
      const s=JSON.parse(r.result);
      if(!s.clothes){ toast('备份文件格式不对'); return; }

    }catch(e){ toast('恢复失败:文件格式错误'); }

}

/* ========== Toast ========== */
function toast(msg){
  let t=$('#toastWrap');
  if(!t){t=document.createElement('div');t.id='toastWrap';t.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:99;opacity:0;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.18)';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',1900);
}

/* ========== 初始化 ========== */
function render(){renderNav();renderTopbar();renderModule();}
